<div class="entry-content">
<p><span style="color: #000000"><strong>【伯二十五1】「书亚人比勒达回答说：」</strong></span></p>
<p><span style="color: #000000"><strong>【伯二十五2】「神有治理之权，有威严可畏；祂在高处施行和平。」</strong></span></p>
<p><span style="color: #000000"><strong>【伯二十五3】「祂的诸军岂能数算？祂的光亮一发，谁不蒙照呢？」</strong></span></p>
<p><span style="color: #000000"><strong>【伯二十五4】「这样在神面前，人怎能称义？妇人所生的怎能洁净？」</strong></span></p>
<p><span style="color: #000000"><strong>【伯二十五5】「在神眼前，月亮也无光亮，星宿也不清洁。」</strong></span></p>
<p><span style="color: #000000"><strong>【伯二十五6】「何况如虫的人，如蛆的世人呢！」</strong></span></p>
