<div class="entry-content">
<p><span style="color: #000000"><strong>【诗一1】「不从恶人的计谋，不站罪人的道路，不坐亵慢人的座位，」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一2】「惟喜爱耶和华的律法，昼夜思想，这人便为有福！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一3】「他要像一棵树栽在溪水旁，按时候结果子，叶子也不枯干。凡他所做的尽都顺利。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一4】「恶人并不是这样，乃像糠秕被风吹散。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一5】「因此，当审判的时候、恶人必站立不住；罪人在义人的会中也是如此；」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一6】「因为耶和华知道义人的道路，恶人的道路却必灭亡。」</strong></span></p>
