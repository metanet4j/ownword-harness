<div class="entry-content">
<p><span style="color:#000000"><strong>【诗三1】「（大卫逃避他儿子押沙龙的时候作的诗。）耶和华啊，我的敌人何其加增；有许多人起来攻击我。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗三2】「有许多人议论我说：他得不着神的帮助。<em>（细拉）</em>」</strong></span></p>
<p><span style="color:#000000"><strong>【诗三3】「但祢——耶和华是我四围的盾牌，是我的荣耀，又是叫我抬起头来的。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗三4】「我用我的声音求告耶和华，祂就从祂的圣山上应允我。<em>（细拉）</em>」</strong></span></p>
<p><span style="color:#000000"><strong>【诗三5】「我躺下睡觉，我醒着，耶和华都保佑我。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗三6】「虽有成万的百姓来周围攻击我，我也不怕。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗三7】「耶和华啊，求祢起来！我的神啊，求祢救我！因为祢打了我一切仇敌的腮骨，敲碎了恶人的牙齿。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗三8】「救恩属乎耶和华；愿祢赐福给祢的百姓。<em>（细拉）</em>」</strong></span></p>
