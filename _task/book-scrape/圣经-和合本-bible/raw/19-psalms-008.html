<div class="entry-content">
<p><span style="color: #000000"><strong>【诗八1】「（大卫的诗，交与伶长。用迦特乐器。）耶和华——我们的主啊，祢的名在全地何其美！祢将祢的荣耀彰显于天。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗八2】「祢因敌人的缘故，从婴孩和吃奶的口中，建立了能力，使仇敌和报仇的闭口无言。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗八3】「我观看祢指头所造的天，并祢所陈设的月亮星宿，」</strong></span></p>
<p><span style="color: #000000"><strong>【诗八4】「便说：人算什么，你竟顾念他！世人算什么，祢竟眷顾他！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗八5】「祢叫他比天使（或译：神）微小一点，并赐他荣耀尊贵为冠冕。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗八6-8】「祢派他管理祢手所造的，使万物，就是一切的牛羊、田野的兽、空中的鸟、海里的鱼，凡经行海道的，都服在他的脚下。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗八9】「耶和华——我们的主啊，祢的名在全地何其美！」</strong></span></p>
</div>
