<div class="entry-content">
<p><span style="color: #000000"><strong>【诗十一1】「（大卫的诗，交与伶长。）我是投靠耶和华；你们怎么对我说：你当像鸟飞往你的山去。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗十一2】「看哪，恶人弯弓，把箭搭在弦上，要在暗中射那心里正直的人」</strong></span></p>
<p><span style="color: #000000"><strong>【诗十一3】「根基若毁坏，义人还能做什么呢？」</strong></span></p>
<p><span style="color: #000000"><strong>【诗十一4】「耶和华在祂的圣殿里；耶和华的宝座在天上；祂的慧眼察看世人。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗十一5】「耶和华试验义人；惟有恶人和喜爱强暴的人，祂心里恨恶。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗十一6】「祂要向恶人密布网罗，有烈火、硫磺、热风，作他们杯中的分。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗十一7】「因为耶和华是公义的，祂喜爱公义；正直人必得见祂的面。」</strong></span></p>
