<div class="entry-content">
<p><span style="color:#000000"><strong>【诗十三1】「（大卫的诗，交与伶长。）耶和华啊，祢忘记我要到几时呢？要到永远吗？祢掩面不顾我要到几时呢？」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十三2】「我心里筹算，终日愁苦，要到几时呢？我的仇敌升高压制我，要到几时呢？」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十三3】「耶和华——我的神啊，求祢看顾我，应允我！使我眼目光明，免得我沉睡至死；」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十三4】「免得我的仇敌说：我胜了他；免得我的敌人在我摇动的时候喜乐。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十三5】「但我倚靠祢的慈爱；我的心因祢的救恩快乐。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十三6】「我要向耶和华歌唱，因祂用厚恩待我。」</strong></span></p>
