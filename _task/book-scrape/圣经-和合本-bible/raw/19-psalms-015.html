<div class="entry-content">
<p><span style="color:#000000"><strong>【诗十五1】「（大卫的诗。）耶和华啊，谁能寄居祢的帐幕？谁能住在祢的圣山？」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十五2】「就是行为正直、做事公义、心里说实话的人。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十五3】「他不以舌头谗谤人，不恶待朋友，也不随伙毁谤邻里；」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十五4】「他眼中藐视匪类，却尊重那敬畏耶和华的人。他发了誓，虽然自己吃亏也不更改。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗十五5】「他不放债取利，不受贿赂以害无辜。行这些事的人必永不动摇。」</strong></span></p>
