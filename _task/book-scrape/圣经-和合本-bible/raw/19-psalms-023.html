<div class="entry-content">
<p><span style="color: #000000"><strong>【诗廿三1】「（大卫的诗。）耶和华是我的牧者，我必不至缺乏。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗廿三2】「祂使我躺卧在青草地上，领我在可安歇的水边。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗廿三3】「祂使我的灵魂苏醒，为自己的名引导我走义路。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗廿三4】「我虽然行过死荫的幽谷，也不怕遭害，因为祢与我同在；祢的杖，祢的竿，都安慰我。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗廿三5】「在我敌人面前，祢为我摆设筵席；祢用油膏了我的头，使我的福杯满溢。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗廿三6】「我一生一世必有恩惠慈爱随着我；我且要住在耶和华的殿中，直到永远。」</strong></span></p>
