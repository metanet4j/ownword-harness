<div class="entry-content">
<p><span style="color:#000000"><strong>【诗四十三1】「神啊，求祢伸我的冤，向不虔诚的国为我辩屈；求祢救我脱离诡诈不义的人。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗四十三2】「因为祢是赐我力量的神，为何丢弃我呢？我为何因仇敌的欺压时常哀痛呢？」</strong></span></p>
<p><span style="color:#000000"><strong>【诗四十三3】「求祢发出你的亮光和真实，好引导我，带我到祢的圣山，到祢的居所！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗四十三4】「我就走到神的祭坛，到我最喜乐的神那里。神啊，我的神，我要弹琴称赞祢！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗四十三5】「我的心哪，你为何忧闷？为何在我里面烦躁？应当仰望神，因我还要称赞祂。祂是我脸上的光荣（原文是帮助），是我的神。」</strong></span></p>
