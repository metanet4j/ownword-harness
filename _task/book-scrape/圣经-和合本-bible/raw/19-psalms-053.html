<div class="entry-content">
<p><span style="color:#000000"><strong>【诗五十三1】「（大卫的训诲诗，交与伶长。调用麻哈拉。）愚顽人心里说：没有神。他们都是邪恶，行了可憎恶的罪孽；没有一个人行善。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十三2】「神从天上垂看世人，要看有明白的没有？有寻求祂的没有？」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十三3】「他们各人都退后，一同变为污秽；并没有行善的，连一个也没有。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十三4】「作孽的没有知识吗？他们吞吃我的百姓如同吃饭一样，并不求告神。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十三5】「他们在无可惧怕之处就大大害怕，因为神把那安营攻击你之人的骨头散开了。你使他们蒙羞，因为神弃绝了他们。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十三6】「但愿以色列的救恩从锡安而出。神救回祂被掳的子民那时，雅各要快乐，以色列要欢喜。」</strong></span></p>
</div>
