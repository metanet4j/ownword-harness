<div class="entry-content">
<p><span style="color:#000000"><strong>【诗五十四1】「（西弗人来对扫罗说：『大卫岂不是在我们那里藏身吗？』那时，大卫作这训诲诗，交与伶长。用丝弦的乐器。）神啊，求祢以祢的名救我，凭祢的大能为我伸冤。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十四2】「神啊，求祢听我的祷告，留心听我口中的言语。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十四3】「因为，外人起来攻击我，强暴人寻索我的命；他们眼中没有神。<em>（细拉）</em>」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十四4】「神是帮助我的，是扶持我命的。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十四5】「祂要报应我仇敌所行的恶；求祢凭祢的诚实灭绝他们。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十四6】「我要把甘心祭献给祢。耶和华啊，我要称赞祢的名；这名本为美好。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗五十四7】「祂从一切的急难中把我救出来；我的眼睛也看见了我仇敌遭报。」</strong></span></p>
</div>
