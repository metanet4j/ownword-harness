<div class="entry-content">
<p><span style="color:#000000"><strong>【诗六十七1】「（一篇诗歌，交与伶长。用丝弦的乐器。）愿神怜悯我们，赐福与我们，用脸光照我们，<em>（细拉）</em>」</strong></span></p>
<p><span style="color:#000000"><strong>【诗六十七2】「好叫世界得知祢的道路，万国得知祢的救恩。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗六十七3】「神啊，愿列邦称赞祢！愿万民都称赞祢！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗六十七4】「愿万国都快乐欢呼；因为祢必按公正审判万民，引导世上的万国。<em>（细拉）</em>」</strong></span></p>
<p><span style="color:#000000"><strong>【诗六十七5】「神啊，愿列邦称赞祢！愿万民都称赞祢！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗六十七6】「地已经出了土产；神——就是我们的神要赐福与我们。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗六十七7】「神要赐福与我们；地的四极都要敬畏祂！」</strong></span></p>
