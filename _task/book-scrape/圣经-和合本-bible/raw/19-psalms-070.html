<div class="entry-content">
<p><span style="color:#000000"><strong>【诗七十1】「（大卫的纪念诗，交与伶长。）神啊，求祢快快搭救我！耶和华啊，求祢速速帮助我！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗七十2】「愿那些寻索我命的，抱愧蒙羞；愿那些喜悦我遭害的，退后受辱。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗七十3】「愿那些对我说阿哈、阿哈的，因羞愧退后。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗七十4】「愿一切寻求祢的，因祢高兴欢喜；愿那些喜爱祢救恩的，常说：当尊神为大！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗七十5】「但我是困苦穷乏的；神啊，求祢速速到我这里来！祢是帮助我的，搭救我的。耶和华啊，求祢不要耽延！」</strong></span></p>
