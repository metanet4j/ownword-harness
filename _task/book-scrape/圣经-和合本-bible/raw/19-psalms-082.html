<div class="entry-content">
<p><span style="color:#000000"><strong>【诗八十二1】「（亚萨的诗。）神站在有权力者的会中，在诸神中行审判，」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十二2】「说：你们审判不秉公义，徇恶人的情面，要到几时呢？<em>（细拉）</em>」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十二3】「你们当为贫寒的人和孤儿伸冤；当为困苦和穷乏的人施行公义。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十二4】「当保护贫寒和穷乏的人，救他们脱离恶人的手。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十二5】「你们仍不知道，也不明白，在黑暗中走来走去；地的根基都摇动了。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十二6】「我曾说：你们是神，都是至高者的儿子。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十二7】「然而，你们要死，与世人一样，要仆倒，像王子中的一位。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十二8】「神啊，求祢起来审判世界，因为祢要得万邦为业。」</strong></span></p>
</div>
