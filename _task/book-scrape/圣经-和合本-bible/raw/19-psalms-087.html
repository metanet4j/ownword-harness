<div class="entry-content">
<p><span style="color:#000000"><strong>【诗八十七1】「（可拉后裔的诗歌。）耶和华所立的根基在圣山上。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十七2】「祂爱锡安的门，胜于爱雅各一切的住处。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十七3】「神的城啊，有荣耀的事乃指着你说的。<em>（细拉）</em>」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十七4】「我要提起拉哈伯和巴比伦人，是在认识我之中的；看哪，非利士和推罗并古实人，个个生在那里。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十七5】「论到锡安，必说：这一个、那一个都生在其中，而且至高者必亲自坚立这城。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十七6】「当耶和华记录万民的时候，祂要点出这一个生在那里。<em>（细拉）</em>」</strong></span></p>
<p><span style="color:#000000"><strong>【诗八十七7】「歌唱的，跳舞的，都要说：我的泉源都在你里面。」</strong></span></p>
