<div class="entry-content">
<p><span style="color: #000000"><strong>【诗九十三1】「耶和华作王！祂以威严为衣穿上；耶和华以能力为衣，以能力束腰，世界就坚定，不得动摇。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗九十三2】「祢的宝座从太初立定；祢从亘古就有。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗九十三3】「耶和华啊，大水扬起，大水发声，波浪澎湃。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗九十三4】「耶和华在高处大有能力，胜过诸水的响声，洋海的大浪。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗九十三5】「耶和华啊，祢的法度最的确；祢的殿永称为圣，是合宜的。」</strong></span></p>
