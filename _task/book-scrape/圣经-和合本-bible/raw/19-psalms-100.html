<p><span style="color:#000000"><strong>【诗一百1】「（称谢诗。）普天下当向耶和华欢呼！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百2】「你们当乐意事奉耶和华，当来向祂歌唱！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百3】「你们当晓得耶和华是神！我们是祂造的，也是属祂的；我们是祂的民，也是祂草场的羊。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百4】「当称谢进入祂的门；当赞美进入祂的院。当感谢祂，称颂祂的名！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百5】「因为耶和华本为善。祂的慈爱存到永远；祂的信实直到万代。」</strong></span></p>
