<p><span style="color: #000000"><strong>【诗一百十四1】「以色列出了埃及，雅各家离开说异言之民；」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百十四2】「那时，犹大为主的圣所，以色列为祂所治理的国度。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百十四3】「沧海看见就奔逃；约旦河也倒流。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百十四4】「大山踊跃，如公羊；小山跳舞，如羊羔。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百十四5】「沧海啊，你为何奔逃？约旦哪，你为何倒流？」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百十四6】「大山哪，你为何踊跃，如公羊？小山哪，你为何跳舞，如羊羔？」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百十四7】「大地啊，你因见主的面，就是雅各神的面，便要震动。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百十四8】「祂叫磐石变为水池，叫坚石变为泉源。」</strong></span></p>
