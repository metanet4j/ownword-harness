<p><span style="color: #000000"><strong>【诗一百二十1】「（上行〔或作登阶，下同〕之诗。）我在急难中求告耶和华，祂就应允我。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百二十2】「耶和华啊，求祢救我脱离说谎的嘴唇和诡诈的舌头！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百二十3】「诡诈的舌头啊，要给你什么呢？要拿什么加给你呢？」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百二十4】「就是勇士的利箭和罗腾木（小树名，松类）的炭火。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百二十5】「我寄居在米设，住在基达帐棚之中，有祸了！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百二十6】「我与那恨恶和睦的人许久同住。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百二十7】「我愿和睦，但我发言，他们就要争战。」</strong></span></p>
