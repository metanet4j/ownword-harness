<p><span style="color: #000000"><strong>【诗一百廿一1】「（上行之诗。）我要向山举目；我的帮助从何而来？」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿一2】「我的帮助从造天地的耶和华而来。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿一3】「祂必不叫你的脚摇动；保护你的必不打盹！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿一4】「保护以色列的，也不打盹也不睡觉。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿一5】「保护你的是耶和华；耶和华在你右边荫庇你。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿一6】「白日，太阳必不伤你；夜间，月亮必不害你。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿一7】「耶和华要保护你，免受一切的灾害；祂要保护你的性命。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿一8】「你出你入，耶和华要保护你，从今时直到永远。」</strong></span></p>
