<p><span style="color:#000000"><strong>【诗一百廿三1】「（上行之诗。）坐在天上的主啊，我向祢举目。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿三2】「看哪，仆人的眼睛怎样望主人的手，使女的眼睛怎样望主母的手，我们的眼睛也照样望耶和华——我们的神，直到祂怜悯我们。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿三3】「耶和华啊，求祢怜悯我们，怜悯我们！因为我们被藐视，已到极处。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿三4】「我们被那些安逸人的讥诮和骄傲人的藐视，已到极处。」</strong></span></p>
