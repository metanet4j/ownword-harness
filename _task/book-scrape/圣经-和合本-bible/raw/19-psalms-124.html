<div class="entry-content">
<p><span style="color: #000000"><strong>【诗一百廿四1】「（大卫上行之诗。）以色列人要说：若不是耶和华帮助我们，」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿四2】「若不是耶和华帮助我们，当人起来攻击我们、」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿四3】「向我们发怒的时候，就把我们活活地吞了。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿四4】「那时，波涛必漫过我们，河水必淹没我们，」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿四5】「狂傲的水必淹没我们。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿四6】「耶和华是应当称颂的！祂没有把我们当野食交给他们吞吃（原文是牙齿）。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿四7】「我们好像雀鸟，从捕鸟人的网罗里逃脱</strong><strong>；网罗破裂，我们逃脱了。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿四8】「我们得帮助，是在乎倚靠造天地之耶和华的名。」</strong></span></p>
</div>
