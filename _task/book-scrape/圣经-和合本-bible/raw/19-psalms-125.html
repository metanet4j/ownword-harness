<p><span style="color:#000000"><strong>【诗一百廿五1】「（上行之诗。）倚靠耶和华的人好像锡安山，永不动摇。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿五2】「众山怎样围绕耶路撒冷，耶和华也照样围绕祂的百姓，从今时直到永远。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿五3】「恶人的杖不常落在义人的分上，免得义人伸手作恶。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿五4】「耶和华啊，求祢善待那些为善和心里正直的人。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿五5】「至于那偏行弯曲道路的人，耶和华必使他和作恶的人一同出去受刑。愿平安归于以色列！」</strong></span></p>
