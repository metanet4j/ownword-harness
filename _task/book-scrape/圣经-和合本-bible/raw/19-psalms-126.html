<div class="entry-content">
<p><span style="color:#000000"><strong>【诗一百廿六1】「（上行之诗。）当耶和华将那些被掳的带回锡安的时候，我们好像做梦的人。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿六2】「我们满口喜笑、满舌欢呼的时候，外邦中就有人说：耶和华为他们行了大事！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿六3】「耶和华果然为我们行了大事，我们就欢喜。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿六4】「耶和华啊，求祢使我们被掳的人归回，好像南地的河水复流。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿六5】「流泪撒种的，必欢呼收割！」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿六6】「那带种流泪出去的，必要欢欢乐乐地带禾捆回来！」</strong></span></p>
