<p><span style="color:#000000"><strong>【诗一百廿七1】「（所罗门上行之诗。）若不是耶和华建造房屋，建造的人就枉然劳力；若不是耶和华看守城池，看守的人就枉然警醒。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿七2】「你们清晨早起，夜晚安歇，吃劳碌得来的饭，本是枉然；惟有耶和华所亲爱的，必叫他安然睡觉。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿七3】「儿女是耶和华所赐的产业；所怀的胎是祂所给的赏赐。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿七4】「少年时所生的儿女好像勇士手中的箭。」</strong></span></p>
<p><span style="color:#000000"><strong>【诗一百廿七5】「箭袋充满的人便为有福；他们在城门口和仇敌说话的时候，必不至于羞愧。」</strong></span></p>
