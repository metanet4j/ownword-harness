<p><span style="color: #000000"><strong>【诗一百廿八1】「（上行之诗。）凡敬畏耶和华、遵行祂道的人便为有福！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿八2】「你要吃劳碌得来的；你要享福，事情顺利。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿八3】「你妻子在你的内室，好像多结果子的葡萄树；你儿女围绕你的桌子，好像橄榄栽子。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿八4】「看哪，敬畏耶和华的人必要这样蒙福！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿八5】「愿耶和华从锡安赐福给你！愿你一生一世看见耶路撒冷的好处！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿八6】「愿你看见你儿女的儿女！愿平安归于以色列！」</strong></span></p>
