<p><span style="color: #000000"><strong>【诗一百廿九1】「（上行之诗。）以色列当说：从我幼年以来，敌人屡次苦害我，」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿九2】「从我幼年以来，敌人屡次苦害我，却没有胜了我。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿九3】「如同扶犁的在我背上扶犁而耕，耕的犁沟甚长。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿九4】「耶和华是公义的；祂砍断了恶人的绳索。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿九5】「愿恨恶锡安的都蒙羞退后！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿九6】「愿他们像房顶上的草，未长成而枯干。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百廿九7】「收割的不够一把，捆禾的也不满怀。</strong>」</span></p>
<p><span style="color: #000000"><strong>【诗一百廿九8】「过路的也不说：愿耶和华所赐的福归与你们！我们奉耶和华的名给你们祝福！」</strong></span></p>
