<p><span style="color: #000000"><strong>【诗一百三十1】「（上行之诗。）耶和华啊，我从深处向祢求告！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百三十2】「主啊，求祢听我的声音！愿祢侧耳听我恳求的声音！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百三十3】「主——耶和华啊，祢若究察罪孽，谁能站得住呢？」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百三十4】「但在祢有赦免之恩，要叫人敬畏祢。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百三十5】「我等候耶和华，我的心等候；我也仰望祂的话。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百三十6】「我的心等候主，胜于守夜的，等候天亮，胜于守夜的，等候天亮。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百三十7】「以色列啊，你当仰望耶和华！因祂有慈爱，有丰盛的救恩。」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百三十8】「祂必救赎以色列脱离一切的罪孽。」</strong></span></p>
