<p><span style="color: #000000"><strong>【诗一百卅三1】「（上行之诗。）看哪，弟兄和睦同居是何等地善，何等地美！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百卅三2】「这好比那贵重的油浇在亚伦的头上，流到胡须，又流到他的衣襟；」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百卅三3】「又好比黑门的甘露降在锡安山；因为在那里有耶和华所命定的福，就是永远的生命。」</strong></span></p>
