<p><span style="color: #000000"><strong>【诗一百卅四1】「（上行之诗。）耶和华的仆人夜间站在耶和华殿中的，你们当称颂耶和华！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百卅四2】「你们当向圣所举手，称颂耶和华！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百卅四3】「愿造天地的耶和华，从锡安赐福给你们！」</strong></span></p>
