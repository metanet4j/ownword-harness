<p><span style="color: #000000"><strong>【诗一百五十1】「你们要赞美耶和华！在神的圣所赞美祂！在祂显能力的穹苍赞美祂！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百五十2】「要因祂大能的作为赞美祂，按着祂极美的大德赞美祂！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百五十3】「要用角声赞美祂，鼓瑟弹琴赞美祂！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百五十4】「击鼓跳舞赞美祂！用丝弦的乐器和箫的声音赞美祂！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百五十5】「用大响的钹赞美祂！用高声的钹赞美祂！」</strong></span></p>
<p><span style="color: #000000"><strong>【诗一百五十6】「凡有气息的都要赞美耶和华！你们要赞美耶和华！」</strong></span></p>
