<div class="entry-content">
<p><span style="color: #000000"><strong>【赛四1】「在那日，七个女人必拉住一个男人，说：『我们吃自己的食物，穿自己的衣服，但求你许我们归你名下；求你除掉我们的羞耻。』」</strong></span></p>
<p><span style="color: #000000"><strong>【赛四2】「到那日，耶和华发生的苗必华美尊荣，地的出产必为以色列逃脱的人显为荣华茂盛。」</strong></span></p>
<p><span style="color: #000000"><strong>【赛四3~4】「主以公义的灵和焚烧的灵，将锡安女子的污秽洗去，又将耶路撒冷中杀人的血除净。那时，剩在锡安、留在耶路撒冷的，就是一切住耶路撒冷、在生命册上记名的，必称为圣。」</strong></span></p>
<p><span style="color: #000000"><strong>【赛四5】「耶和华也必在锡安全山，并各会众以上，使白日有烟云，黑夜有火焰的光。因为在全荣耀之上必有遮蔽。」</strong></span></p>
<p><span style="color: #000000"><strong>【赛四6】「必有亭子，白日可以得荫避暑，也可以作为藏身之处，躲避狂风暴雨。」</strong></span></p>
