<div class="entry-content">
<p><span style="color: #000000"><strong>【赛十二1】「到那日，你必说：耶和华啊，我要称谢祢！因为祢虽然向我发怒，祢的怒气却已转消；祢又安慰了我。」</strong></span></p>
<p><span style="color: #000000"><strong>【赛十二2】「看哪！神是我的拯救；我要倚靠祂，并不惧怕。因为主耶和华是我的力量，是我的诗歌，祂也成了我的拯救。」</strong></span></p>
<p><span style="color: #000000"><strong>【赛十二3】「所以，你们必从救恩的泉源欢然取水。」</strong></span></p>
<p><span style="color: #000000"><strong>【赛十二4】「在那日，你们要说：当称谢耶和华，求告祂的名；将祂所行的传扬在万民中，提说祂的名已被尊崇。」</strong></span></p>
<p><span style="color: #000000"><strong>【赛十二5】「你们要向耶和华唱歌，因祂所行的甚是美好；但愿这事普传天下。」</strong></span></p>
<p><span style="color: #000000"><strong>【赛十二6】「锡安的居民哪，当扬声欢呼，因为在你们中间的以色列圣者乃为至大。」</strong></span></p>
