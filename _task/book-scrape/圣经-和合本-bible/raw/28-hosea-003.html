<div class="entry-content">
<p><span style="color:#000000"><strong>【何三1】「耶和华对我说：『你再去爱一个淫妇，就是她情人所爱的；好像以色列人，虽然偏向别神，喜爱葡萄饼，耶和华还是爱他们。』」</strong></span></p>
<p><span style="color:#000000"><strong>【何三2】「我便用银子十五舍客勒，大麦一贺梅珥半，买她归我。」</strong></span></p>
<p><span style="color:#000000"><strong>【何三3】「我对她说：『你当多日为我独居，不可行淫，不可归别人为妻，我向你也必这样。』」</strong></span></p>
<p><span style="color:#000000"><strong>【何三4】「以色列人也必多日独居，无君王，无首领，无祭祀，无柱像，无以弗得，无家中的神像。」</strong></span></p>
<p><span style="color:#000000"><strong>【何三5】「后来以色列人必归回（或译：回心转意），寻求他们的神——耶和华和他们的王大卫。在末后的日子，必以敬畏的心归向耶和华，领受祂的恩惠。」</strong></span></p>
