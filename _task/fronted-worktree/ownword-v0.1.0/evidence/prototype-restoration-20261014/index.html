<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OwnWord v0.1.0 原型还原对照</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;color:#292929;background:#f8f8f8}header{padding:24px 32px;border-bottom:1px solid #dadada;background:white}h1{margin:0;font-size:24px}p{margin:12px 0 0;max-width:1000px}nav{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:16px}a{color:#274dea}select{font:inherit;padding:8px;border:1px solid #c6c6c6;border-radius:8px;background:white}main{padding:24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:8px}figure a{display:block}img{display:block;width:100%;height:auto;border:1px solid #dadada;background:white}.empty{padding:24px;background:white;border:1px solid #dadada}footer{padding:0 32px 32px;color:#505050}@media(max-width:900px){main{grid-template-columns:1fr}header{padding:20px}}
</style></head><body><header><h1>OwnWord v0.1.0 原型还原对照</h1><p>基准：prototype/official-s2-20261013-213507（a86850a）。用户确认继续沿用此 tag。原型的 Artifact、作品、关系、搜索与密钥轮换按 v0.1 范围过滤；真实标识、模拟提示及未知状态保留实际来源。</p><nav><label for="screen">页面</label><select id="screen"><option value="welcome">首页 · 1440 × 1000</option><option value="identity">我的身份 · 1440 × 1000</option><option value="edit">编辑资料 · 1440 × 1000</option><option value="setup">设置身份 · 1440 × 1000</option><option value="review">核对资料 · 1440 × 1000</option><option value="preview">身份卡片 · 1440 × 1000</option><option value="mobile-edit">手机编辑 · 320 × 740</option><option value="mobile-preview">中文深色卡片 · 320 × 740</option></select><a href="http://127.0.0.1:5041/">打开真实实现</a><a href="card-reference-source.json">卡片来源校验</a></nav><p id="note"></p></header><main id="comparison"></main><footer>点击截图查看原尺寸。卡片基准为从 tag 原始组件独立编译的视觉参考，不是生产页面或集成测试数据源；原型样例标识与实现中的真实钱包标识不同。未采集的改前状态明确留空。整项验收仍受真实公共索引及主网资金门禁限制。</footer><script>
const names=['固定原型','修正前','修正后'];const notes={welcome:'保留穹顶、字体、地平线及连接主操作。v0.1 排除 Find identity 和下方作品展示。',identity:'恢复 960px 身份工作区与紧凑标识区。模拟资料不标为公开已发布。',edit:'恢复标题、行内 BAP ID、头像、字段间距、字级及操作区。上传限制与模拟状态使用真实服务信息。',setup:'实现侧由真实钱包账户和真实身份接口进入允许的模拟资料准备流程；公共状态仍为 unknown。',review:'相同名称、类型与简介编辑值；钱包提交前核对资料。模拟模式明确说明不会广播。',preview:'卡片基准来自冻结的 ArtifactPublicIdentity → IdentityCard，隐藏 v0.1 不包含的 Artifact 摘要；恢复原始双面结构、完整标识与两处折叠详情。','mobile-edit':'短屏保留原型固定操作栏；320px 不应发生横向溢出。','mobile-preview':'中文深色、键盘翻面与减少动态效果另有浏览器检查。'};
function render(){const page=document.getElementById('screen').value;document.getElementById('note').textContent=notes[page];const columns=page.startsWith('mobile')?[null,page==='mobile-edit'?'before-mobile-edit.png':null,'after-'+page+'.png']:['prototype-'+page+'.png',['setup','review'].includes(page)?null:'before-'+page+'.png','after-'+page+'.png'];document.getElementById('comparison').replaceChildren(...columns.map((file,i)=>{const f=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=names[i];f.append(caption);if(!file){const text=document.createElement('div');text.className='empty';text.textContent='本轮未采集此状态。';f.append(text);return f;}const a=document.createElement('a'),img=document.createElement('img');a.href=file;a.target='_blank';a.rel='noopener';img.src=file;img.alt=names[i]+' · '+page;a.append(img);f.append(a);return f;}));}
document.getElementById('screen').addEventListener('change',render);render();
</script></body></html>
