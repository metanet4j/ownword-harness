<!-- @dsCard group="Components" viewport="960x780" name="Content" subtitle="Text, Heading, Content, Divider, Badge, StatusLight, LabeledValue, Avatar, IllustratedMessage." -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../styles.css">
  <title>Content</title>
</head>
<body class="spectrum spectrum--light spectrum--medium">
  <main id="root"></main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const lib = window.ReactSpectrum4_51380d;
    const items = [
      {name: "Text", node: <div style={{display: "flex", flexDirection: "column", gap: 6}}><lib.Text label="Body text" /><lib.Text isMuted label="Muted text" /></div>},
      {name: "Heading", node: <div style={{display: "flex", flexDirection: "column", gap: 6}}><lib.Heading label="Section title" /><lib.Heading label="Subsection" /></div>},
      {name: "Content", node: <lib.Content label="Section content with relaxed line height." />},
      {name: "Divider", node: <div style={{display: "flex", gap: 12, alignItems: "center"}}><span className="s2-text">A</span><lib.Divider /><span className="s2-text">B</span></div>},
      {name: "Badge", node: <div style={{display: "flex", gap: 8}}><lib.Badge variant="positive" label="Active" /><lib.Badge variant="negative" label="Blocked" /><lib.Badge variant="notice" label="Pending" /></div>},
      {name: "StatusLight", node: <div style={{display: "flex", flexDirection: "column", gap: 8}}><lib.StatusLight variant="positive" label="Connected" /><lib.StatusLight variant="notice" label="Syncing" /></div>},
      {name: "LabeledValue", node: <lib.LabeledValue label="Format" value="PNG" />},
      {name: "Avatar", node: <div style={{display: "flex", gap: 8, alignItems: "center"}}><lib.Avatar label="RS" /><lib.Avatar label="JD" /><lib.Avatar size="L" label="RS" /></div>},
      {name: "IllustratedMessage", node: <lib.IllustratedMessage heading="No results" description="Try a different search term." />},
    ];
    function SpectrumGallery() {
      return (
        <section className="s2-gallery">
          {items.map(({name, node}) => (
            <article className="s2-gallery-item" key={name}>
              <small>{name}</small>
              {node}
            </article>
          ))}
        </section>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<SpectrumGallery />);
  </script>
</body>
</html>
