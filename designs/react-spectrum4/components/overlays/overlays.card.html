<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../styles.css">
  <title>Overlays &amp; Feedback</title>
</head>
<body class="spectrum spectrum--light spectrum--medium">
  <main id="root"></main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const lib = window.ReactSpectrum4_51380d;
    const items = [
      {name: "Dialog", node: <lib.Dialog label="Settings" description="Adjust your preferences." />},
      {name: "AlertDialog", node: <lib.AlertDialog title="Delete this item?" variant="destructive" />},
      {name: "Tooltip", node: <lib.Tooltip content="Copy to clipboard" />},
      {name: "Toast", node: <div style={{display: "flex", gap: 8, flexWrap: "wrap"}}><lib.Toast variant="positive" label="Saved" /><lib.Toast variant="negative" label="Failed" /></div>},
      {name: "InlineAlert", node: <div style={{display: "flex", flexDirection: "column", gap: 8}}><lib.InlineAlert variant="informative" heading="Heads up" /><lib.InlineAlert variant="negative" heading="Update failed" /></div>},
      {name: "ProgressBar", node: <lib.ProgressBar label="Uploading" value={64} />},
      {name: "ProgressCircle", node: <lib.ProgressCircle value={64} />},
    ];
    function SpectrumGallery() {
      return (
        <section className="s2-gallery">
          {items.map(({name, node}) => (
            <article className="s2-gallery-item" key={name}>
              <small>{name}</small>
              {node}
            </article>
          ))}
        </section>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<SpectrumGallery />);
  </script>
</body>
</html>
