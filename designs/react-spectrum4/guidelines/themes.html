<!-- @dsCard group="Themes" viewport="700x170" name="Themes" subtitle="light, dark, darkest, lightest color schemes." -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <title>Themes</title>
</head>
<body class="spectrum spectrum--light spectrum--medium">
  <main class="ds-card"><div class="ds-row" style="align-items:stretch">
    <div class="ds-theme-panel" style="background:var(--spectrum-gray-100); border:1px solid var(--spectrum-gray-400)"><small style="color:var(--spectrum-gray-900)">light</small></div>
    <div class="ds-theme-panel spectrum--dark" style="background:var(--spectrum-gray-100); border:1px solid var(--spectrum-gray-600)"><small style="color:var(--spectrum-gray-100)">dark</small></div>
    <div class="ds-theme-panel spectrum--darkest" style="background:var(--spectrum-gray-100); border:1px solid var(--spectrum-gray-700)"><small style="color:var(--spectrum-gray-100)">darkest</small></div>
    <div class="ds-theme-panel spectrum--lightest" style="background:var(--spectrum-gray-100); border:1px solid var(--spectrum-gray-300)"><small style="color:var(--spectrum-gray-900)">lightest</small></div>
  </div></main>
</body>
</html>
